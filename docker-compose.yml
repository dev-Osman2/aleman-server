services:
  postgres:
    image: postgres:16-alpine
    container_name: aleman_postgres
    restart: always
    environment:
      POSTGRES_USER: aleman_admin
      POSTGRES_PASSWORD: aleman_password_123
      POSTGRES_DB: aleman_store_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: